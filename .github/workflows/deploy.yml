name: Build & Deploy Michael's Portfiolo

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_BUCKET: michaeldavid.world
      AWS_REGION: eu-north-1
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"

      - name: Parse Version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "release=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Michael Web App
        run: |
          flutter build web --release --tree-shake-icons --web-resources-cdn \
            --base-href / \
            --dart-define=APP_VERSION=${{ steps.version.outputs.release }}

      - name: Move build artifacts
        env:
          VERSION: ${{ steps.version.outputs.release }}
        run: |
          mkdir -p build/web_output/$VERSION
          mv build/web/* build/web_output/$VERSION/
          mv build/web_output/$VERSION/index.html build/web_output/index.html
          echo "{\"version\": \"$VERSION\"}" > build/web_output/version.json
          python3 - <<'PY'
          from pathlib import Path
          import os

          version = os.environ["VERSION"]
          path = Path("build/web_output/index.html")
          html = path.read_text()
          replacements = {
              'src="flutter_bootstrap.js"': f'src="/{version}/flutter_bootstrap.js"',
              'href="assets/assets/images/portrait_cutout.webp"': f'href="/{version}/assets/assets/images/portrait_cutout.webp"',
              'content="icons/Icon-512.png"': f'content="/{version}/icons/Icon-512.png"',
              'href="icons/apple-touch-icon.png"': f'href="/{version}/icons/apple-touch-icon.png"',
              'href="favicon.png"': f'href="/{version}/favicon.png"',
              'href="manifest.json"': f'href="/{version}/manifest.json"',
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f"Expected {old!r} in index.html")
              html = html.replace(old, new)
          path.write_text(html)
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Upload to S3
        run: |
          aws s3 cp build/web_output/${{ steps.version.outputs.release }}/ s3://$AWS_BUCKET/${{ steps.version.outputs.release }}/ \
          --recursive \
          --cache-control "public, max-age=31536000, immutable"

          aws s3 cp build/web_output/index.html s3://$AWS_BUCKET/index.html \
            --cache-control "no-store, no-cache, must-revalidate"

          aws s3 cp build/web_output/version.json s3://$AWS_BUCKET/version.json \
            --cache-control "no-store, no-cache, must-revalidate"

          aws s3 website s3://$AWS_BUCKET --index-document index.html --error-document index.html
